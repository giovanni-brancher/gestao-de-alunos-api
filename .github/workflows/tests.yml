name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes e gerar relatório
        run: npm run test:report
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
          JWT_SECRET: segredo-dev-gestao-de-alunos
          ADMIN_EMAIL: admin@escola.com
          ADMIN_SENHA: admin123

      - name: Publicar relatório dos testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-mochawesome
          path: mochawesome-report/
